type: vertical-stack
cards:
  - type: tile
    entity: switch.data_collection
    name: Zbieranie danych
    icon: mdi:database-clock
    tap_action:
      action: toggle
  - type: markdown
    content: >-
      {% set sw = states('switch.data_collection') %}
      {% set r = states('sensor.recommendation') %}
      {% set reason = state_attr('sensor.recommendation','reason') %}
      {% if sw == 'off' %}
      ## ⏸ Zbieranie wstrzymane
      {% elif r == 'insufficient_data' %}
      ## ⏳ Zbieranie danych
      Pokrycie: **{{ states('sensor.data_coverage') }}%**
      {% elif r == 'zone_conflict' %}
      ## ⚠️ Konflikt stref
      Przy wspólnym zasilaniu nie zmieniaj krzywej bez weryfikacji.
      {% elif r == 'raise' %}
      ## ⬆️ Do weryfikacji / możliwe podniesienie
      Sugestia: **+{{ state_attr('sensor.recommendation','recommended_adjustment_c') }} °C**
      {% elif r == 'lower' %}
      ## ⬇️ Możliwe obniżenie
      Sugestia: **{{ state_attr('sensor.recommendation','recommended_adjustment_c') }} °C**
      {% elif r == 'no_change' %}
      ## ✅ Bez zmian
      {% else %}
      ## ℹ️ {{ r }}
      {% endif %}
      {% if reason %}

      {{ reason }}
      {% endif %}
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.data_coverage
        name: Pokrycie
        min: 0
        max: 100
      - type: gauge
        entity: sensor.confidence
        name: Pewność
        min: 0
        max: 100
  - type: markdown
    content: >-
      {% set response = state_attr('sensor.recommendation','estimated_response_hours') %}
      {% set profile = state_attr('sensor.recommendation','house_profile') or {} %}
      {% set ev = state_attr('sensor.recommendation','change_evaluation') %}
      ### 🧠 Nauka budynku
      Czas reakcji: **{{ response ~ ' h' if response is not none else 'uczę się' }}**

      Profil temperaturowy: **{{ profile | count }} przedziałów**

      {% if ev %}
      Ostatnia ocena zmiany: **{{ ev.get('status') }}**
      {% else %}
      Ocena zmiany: **brak danych**
      {% endif %}
